<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Hybrid RAG AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = { theme: { extend: { colors: { background: '#131722', panel: '#1e222d', accent: '#2962ff', border: '#2a2e39' } } } }
        marked.setOptions({ breaks: true, gfm: true });
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #131722;
            color: #d1d4dc;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #2a2e39;
            border-radius: 3px;
        }

        .markdown-body h3 {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 0.25rem;
            color: #fff;
        }

        .markdown-body p {
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        const { createChart, CrosshairMode } = window.LightweightCharts;

        const AppContext = createContext();
        function AppProvider({ children }) {
            const [stockCode, setStockCode] = useState(null);
            const [stockName, setStockName] = useState(null);
            const [legendData, setLegendData] = useState(null);
            const setStockInfo = (code, name) => { setStockCode(code); setStockName(name); };
            return (
                <AppContext.Provider value={{ stockCode, stockName, setStockInfo, legendData, setLegendData }}>
                    {children}
                </AppContext.Provider>
            );
        }

        // ---------- 완벽 분리형 프로 차트 컴포넌트 ----------
        function TVChart({ data }) {
            const chartContainerRef = useRef(null);
            const { setLegendData } = useContext(AppContext);
            const [timeRange, setTimeRange] = useState('ALL');
            const chartRef = useRef(null);

            useEffect(() => {
                if (!data || !chartContainerRef.current) return;
                const { history } = data;

                const chart = createChart(chartContainerRef.current, {
                    layout: {
                        background: { type: 'solid', color: '#131722' },
                        textColor: '#8b95a1',
                        fontSize: 11
                    },
                    grid: { vertLines: { color: 'rgba(42, 46, 57, 0.2)' }, horzLines: { color: 'rgba(42, 46, 57, 0.2)' } },
                    crosshair: { mode: CrosshairMode.Normal },
                    leftPriceScale: { visible: true, borderColor: '#2a2e39' },
                    rightPriceScale: { visible: true, borderColor: '#2a2e39' },
                    timeScale: { borderColor: '#2a2e39', timeVisible: false, rightOffset: 5 },
                    localization: {
                        locale: 'ko-KR', dateFormat: 'yyyy-MM-dd',
                        priceFormatter: price => Math.floor(price).toLocaleString(),
                    },
                    autoSize: true,
                });
                chartRef.current = chart;

                chart.priceScale('left').applyOptions({ scaleMargins: { top: 0.05, bottom: 0.35 } });
                chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.05, bottom: 0.35 } });

                const candleData = history.map(item => ({ time: item.time, open: item.open, high: item.high, low: item.low, close: item.close }));
                const ma5Data = history.map(item => ({ time: item.time, value: item.ma5 })).filter(d => d.value);
                const ma20Data = history.map(item => ({ time: item.time, value: item.ma20 })).filter(d => d.value);
                const ma60Data = history.map(item => ({ time: item.time, value: item.ma60 })).filter(d => d.value);
                const bbUpData = history.map(item => ({ time: item.time, value: item.bb_upper })).filter(d => d.value);
                const bbLowData = history.map(item => ({ time: item.time, value: item.bb_lower })).filter(d => d.value);

                // 스케일 동기화용 투명 캔들 (오른쪽 축)
                const syncCandle = chart.addCandlestickSeries({
                    priceScaleId: 'right',
                    upColor: 'transparent', downColor: 'transparent', borderVisible: false, wickUpColor: 'transparent', wickDownColor: 'transparent',
                    lastValueVisible: false, priceLineVisible: false
                });
                syncCandle.setData(candleData);

                // 지표용 투명 라인 (왼쪽 축)
                const invisibleOptions = { priceScaleId: 'left', color: 'transparent', lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false };
                chart.addLineSeries(invisibleOptions).setData(ma5Data);
                chart.addLineSeries(invisibleOptions).setData(ma20Data);
                chart.addLineSeries(invisibleOptions).setData(ma60Data);
                chart.addLineSeries(invisibleOptions).setData(bbUpData);
                chart.addLineSeries(invisibleOptions).setData(bbLowData);

                // 진짜 캔들스틱 (왼쪽 축)
                const candlestickSeries = chart.addCandlestickSeries({
                    priceScaleId: 'left',
                    upColor: '#ef5350', downColor: '#2962ff', borderVisible: false,
                    wickUpColor: '#ef5350', wickDownColor: '#2962ff',
                });
                candlestickSeries.setData(candleData);

                const markers = [];
                history.forEach(item => {
                    if (item.signal) {
                        const isWarning = item.signal.includes('저항') || item.signal.includes('상단');
                        markers.push({
                            time: item.time, position: isWarning ? 'aboveBar' : 'belowBar',
                            color: isWarning ? '#ef5350' : '#2962ff', shape: isWarning ? 'arrowDown' : 'arrowUp',
                        });
                    }
                });
                candlestickSeries.setMarkers(markers);

                // ⭐ 이평선/볼린저밴드 가로선 부활 (priceLineVisible: true)
                const overlayOptions = { priceScaleId: 'right', lastValueVisible: true, priceLineVisible: true };

                const ma5Series = chart.addLineSeries({ ...overlayOptions, color: '#ec4899', lineWidth: 1.5 });
                ma5Series.setData(ma5Data);
                const ma20Series = chart.addLineSeries({ ...overlayOptions, color: '#f59e0b', lineWidth: 1.5 });
                ma20Series.setData(ma20Data);
                const ma60Series = chart.addLineSeries({ ...overlayOptions, color: '#a855f7', lineWidth: 1.5 });
                ma60Series.setData(ma60Data);
                const bbUpSeries = chart.addLineSeries({ ...overlayOptions, color: '#787b86', lineWidth: 1, lineStyle: 2 });
                bbUpSeries.setData(bbUpData);
                const bbLowSeries = chart.addLineSeries({ ...overlayOptions, color: '#787b86', lineWidth: 1, lineStyle: 2 });
                bbLowSeries.setData(bbLowData);

                // 거래량
                const volumeSeries = chart.addHistogramSeries({ priceScaleId: 'volume' });
                chart.priceScale('volume').applyOptions({
                    position: 'right', visible: true, scaleMargins: { top: 0.7, bottom: 0.15 },
                });
                volumeSeries.setData(history.map((item, idx) => {
                    const prevClose = idx > 0 ? history[idx - 1].close : item.open;
                    return { time: item.time, value: item.volume, color: item.close >= prevClose ? 'rgba(239, 83, 80, 0.4)' : 'rgba(41, 98, 255, 0.4)' };
                }));

                // RSI(14)
                const rsiSeries = chart.addLineSeries({ color: '#06b6d4', lineWidth: 1.5, priceScaleId: 'rsi' });
                chart.priceScale('rsi').applyOptions({
                    position: 'right', visible: true, scaleMargins: { top: 0.85, bottom: 0.0 },
                });
                rsiSeries.setData(history.map(item => ({ time: item.time, value: item.rsi })).filter(d => d.value));
                rsiSeries.createPriceLine({ price: 70, color: '#ef5350', lineWidth: 1, lineStyle: 2, axisLabelVisible: true });
                rsiSeries.createPriceLine({ price: 30, color: '#2962ff', lineWidth: 1, lineStyle: 2, axisLabelVisible: true });

                // 데이터 추출 및 Context 반영
                const extractLegendData = (item, param) => {
                    if (!item) return null;
                    let m5 = item.ma5, m20 = item.ma20, m60 = item.ma60, bUp = item.bb_upper, bLow = item.bb_lower;
                    if (param && param.seriesData) {
                        const dM5 = param.seriesData.get(ma5Series); if (dM5) m5 = dM5.value;
                        const dM20 = param.seriesData.get(ma20Series); if (dM20) m20 = dM20.value;
                        const dM60 = param.seriesData.get(ma60Series); if (dM60) m60 = dM60.value;
                        const dUp = param.seriesData.get(bbUpSeries); if (dUp) bUp = dUp.value;
                        const dLow = param.seriesData.get(bbLowSeries); if (dLow) bLow = dLow.value;
                    }
                    return { ...item, ma5: m5, ma20: m20, ma60: m60, bb_upper: bUp, bb_lower: bLow };
                };

                setLegendData(extractLegendData(history[history.length - 1], null));
                chart.subscribeCrosshairMove((param) => {
                    if (param.time && param.seriesData.size > 0) {
                        const item = history.find(h => h.time === param.time);
                        setLegendData(extractLegendData(item, param));
                    } else {
                        setLegendData(extractLegendData(history[history.length - 1], null));
                    }
                });

                return () => chart.remove();
            }, [data]);

            // 기간 필터 기능
            useEffect(() => {
                if (!chartRef.current || !data) return;
                const { history } = data;
                let range = history.length;
                if (timeRange === '1M') range = 20;
                if (timeRange === '3M') range = 60;
                if (timeRange === '1Y') range = 250;

                const visibleData = history.slice(Math.max(history.length - range, 0));
                if (visibleData.length > 0) {
                    chartRef.current.timeScale().setVisibleRange({
                        from: visibleData[0].time,
                        to: visibleData[visibleData.length - 1].time
                    });
                }
            }, [timeRange, data]);

            return (
                <div className="relative w-full h-full flex flex-col">
                    <div className="absolute top-2 right-[80px] z-20 flex bg-black/40 rounded p-1 backdrop-blur-sm border border-white/5">
                        {['1M', '3M', '1Y', 'ALL'].map(range => (
                            <button
                                key={range} onClick={() => setTimeRange(range)}
                                className={`px-3 py-1 text-xs font-bold rounded transition-colors ${timeRange === range ? 'bg-[#2962ff] text-white' : 'text-gray-400 hover:text-white'}`}
                            >
                                {range === 'ALL' ? '전체' : range}
                            </button>
                        ))}
                    </div>

                    <div className="flex-1 w-full relative" ref={chartContainerRef}>
                        <div className="absolute bottom-[17%] left-16 z-10 text-gray-500 text-xs font-bold pointer-events-none">거래량</div>
                        <div className="absolute bottom-[2%] left-16 z-10 text-[#06b6d4] text-xs font-bold pointer-events-none">RSI (14)</div>
                    </div>
                </div>
            );
        }

        // ---------- AI 채팅 패널 ----------
        function ChatPanel() {
            const { stockCode, setStockInfo } = useContext(AppContext);
            const [messages, setMessages] = useState([
                { type: 'ai', text: '어떤 종목을 분석해드릴까요?' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const handleSend = async () => {
                if (!input.trim() || loading) return;
                const userMsg = input.trim();
                setMessages(prev => [...prev, { type: 'user', text: userMsg }]);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch(`/ask_ai?question=${encodeURIComponent(userMsg)}`);
                    const data = await res.json();
                    setMessages(prev => [...prev, { type: 'ai', text: data.answer }]);
                    if (data.stock_code) setStockInfo(data.stock_code, data.stock_name);
                } catch (err) {
                    setMessages(prev => [...prev, { type: 'ai', text: `오류: ${err.message}` }]);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

            return (
                <div className="flex flex-col h-full bg-[#1e222d] border-l border-[#2a2e39] text-sm">
                    <div className="p-4 border-b border-[#2a2e39] flex items-center justify-between bg-[#131722]/50">
                        <h2 className="font-bold text-white flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-[#2962ff]"></span> AI 리포트
                        </h2>
                    </div>
                    <div className="flex-1 overflow-y-auto p-5 space-y-5">
                        {messages.map((msg, i) => (
                            <div key={i} className={`flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                <div className={`max-w-[90%] rounded-xl px-5 py-4 ${msg.type === 'user' ? 'bg-[#2962ff] text-white rounded-br-sm' : 'bg-[#2a2e39] text-gray-200 rounded-tl-sm shadow-lg'}`}>
                                    <div className="markdown-body" dangerouslySetInnerHTML={{ __html: marked.parse(msg.text) }} />
                                </div>
                            </div>
                        ))}
                        {loading && <div className="bg-[#2a2e39] rounded-xl px-5 py-4 text-gray-400 animate-pulse rounded-tl-sm w-fit">분석 중...</div>}
                        <div ref={messagesEndRef} />
                    </div>
                    <div className="p-4 bg-[#131722]/50 border-t border-[#2a2e39]">
                        <input
                            type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()}
                            placeholder="종목을 입력하세요..."
                            className="w-full bg-[#2a2e39] text-white rounded-lg px-4 py-3 outline-none focus:ring-1 focus:ring-[#2962ff]"
                        />
                    </div>
                </div>
            );
        }

        // ---------- 메인 레이아웃 ----------
        function App() {
            const { stockCode, stockName, legendData } = useContext(AppContext);
            const [chartData, setChartData] = useState(null);

            useEffect(() => {
                if (!stockCode) return;
                fetch(`/api/chart_data?code=${encodeURIComponent(stockCode)}&name=${encodeURIComponent(stockName || '')}`)
                    .then(r => r.json())
                    .then(data => { if (data.status === 'success') setChartData(data); });
            }, [stockCode]);

            return (
                <div className="flex w-full h-[100vh] bg-[#131722] overflow-hidden text-sm">
                    {/* 차트 영역 */}
                    <div className="flex-1 flex flex-col h-full relative border-r border-[#1e222d] min-w-0">

                        {/* 상단 데이터 헤더 */}
                        <div className="w-full border-b border-[#1e222d] bg-[#131722]/95 z-40 px-5 py-3 shrink-0 flex flex-col justify-center">
                            <div className="flex items-center gap-3">
                                <span className="font-bold text-white text-xl tracking-tight">
                                    {stockName || "종목을 검색해주세요"}
                                    {stockCode && <span className="text-gray-500 text-sm ml-2 font-normal">{stockCode}</span>}
                                </span>
                                {legendData?.signal && (
                                    <span className={`px-2 py-0.5 text-[0.7rem] font-bold rounded text-white ${legendData.signal.includes('저항') || legendData.signal.includes('상단') ? 'bg-[#ef5350]' : 'bg-[#2962ff]'}`}>
                                        {legendData.signal.includes('저항') || legendData.signal.includes('상단') ? '🚨 매도주의 (단기고점)' : '💡 매수타점 (눌림목)'}
                                    </span>
                                )}
                            </div>

                            {legendData ? (
                                <div className="flex flex-wrap items-center gap-x-5 gap-y-1 mt-2 text-[0.8rem] font-mono">
                                    <div className="flex gap-3">
                                        <span className="text-gray-400">시가 <span className="text-white ml-0.5">{Math.floor(legendData.open).toLocaleString()}</span></span>
                                        <span className="text-gray-400">고가 <span className="text-[#ef5350] ml-0.5">{Math.floor(legendData.high).toLocaleString()}</span></span>
                                        <span className="text-gray-400">저가 <span className="text-[#2962ff] ml-0.5">{Math.floor(legendData.low).toLocaleString()}</span></span>
                                        <span className="text-gray-400">종가 <span className="text-white ml-0.5 font-bold text-[0.9rem]">{Math.floor(legendData.close).toLocaleString()}</span></span>
                                    </div>
                                    <div className="w-[1px] h-3 bg-[#2a2e39]"></div>
                                    <div className="flex gap-3 font-bold">
                                        {legendData.ma5 && <span className="text-[#ec4899]">MA5: {Math.floor(legendData.ma5).toLocaleString()}</span>}
                                        {legendData.ma20 && <span className="text-[#f59e0b]">MA20: {Math.floor(legendData.ma20).toLocaleString()}</span>}
                                        {legendData.ma60 && <span className="text-[#a855f7]">MA60: {Math.floor(legendData.ma60).toLocaleString()}</span>}
                                    </div>
                                    <div className="w-[1px] h-3 bg-[#2a2e39]"></div>
                                    <div className="flex gap-3 font-bold">
                                        <span className="text-gray-400">Vol: {Math.floor(legendData.volume).toLocaleString()}</span>
                                        <span className="text-[#06b6d4]">RSI: {legendData.rsi ? legendData.rsi.toFixed(1) : 0}</span>
                                    </div>
                                    <div className="flex gap-3 font-bold">
                                        <span className="text-gray-500 ml-2">({legendData.time})</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-6 mt-2"></div>
                            )}
                        </div>

                        <div className="flex-1 w-full relative pt-2 pb-2 px-2">
                            {chartData ? <TVChart data={chartData} /> : <div className="w-full h-full flex items-center justify-center text-gray-500">종목을 검색해주세요</div>}
                        </div>
                    </div>

                    <div className="w-[450px] shrink-0 h-full"><ChatPanel /></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><App /></AppProvider>);
    </script>
</body>

</html>
